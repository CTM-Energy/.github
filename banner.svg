  </g>
  <text x="80" y="170" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="2"><tspan fill="#FFFFFF">CTM</tspan><tspan fill="#22C55E" dx="24">ENERGY</tspan></text>
  <rect x="84" y="196" width="140" height="5" rx="2.5" fill="url(#flow)"/>
  <text x="82" y="248" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="6" fill="#CBD5E1">POWER. STORE. SCALE.</text>
